[workspace]
resolver = "2"
members = ["crates/*"]
# The desktop crate is intentionally excluded from the default workspace until
# Tauri v2 system dependencies / crates are available in the build environment.
# Add "crates/routogram-desktop" to members when building the native installer.
exclude = ["crates/routogram-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.97"

[workspace.dependencies]
napi = { version = "3.15.0", default-features = false, features = ["napi8"] }
napi-derive = "3.6.13"
napi-build = "2.6.0"
oxc_allocator = "0.156.0"
oxc_parser = "0.156.0"
oxc_span = "0.156.0"
walkdir = "2.5.0"
ignore = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
lightningcss = { version = "1.0.0-alpha.72", default-features = false }
cssparser = "0.37.0"
oxc_ast = "0.156.0"
oxc_ast_visit = "0.156.0"
oxc_syntax = "0.156.0"
serde_json = "1.0.154"
git2 = { version = "0.20.2", default-features = false, features = ["vendored-libgit2"] }
oxc_codegen = "0.156.0"
similar = "2.7.0"
