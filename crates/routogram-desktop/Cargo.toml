[package]
name = "routogram-desktop"
version = "0.1.0"
edition = "2021"
description = "Routogram Standalone Desktop Application"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
routogram-core = { path = "../routogram-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
