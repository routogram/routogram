[package]
name = "routogram-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native static-analysis core and Node.js bridge for Routogram."
publish = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "routogram-lsp"
path = "src/bin/routogram-lsp.rs"
required-features = ["lsp-cli"]

[dependencies]
napi = { workspace = true, optional = true }
napi-derive = { workspace = true, optional = true }
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_span.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_syntax.workspace = true
lightningcss.workspace = true
cssparser.workspace = true
walkdir.workspace = true
ignore.workspace = true
serde.workspace = true
serde_json.workspace = true
git2 = { workspace = true, optional = true }
oxc_codegen.workspace = true
similar.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tower-lsp = { version = "0.20.0", optional = true }
tokio = { version = "1.48.0", features = ["rt-multi-thread", "io-std", "macros"], optional = true }

[features]
default = ["git-history", "napi"]
git-history = ["dep:git2"]
napi = ["dep:napi", "dep:napi-derive"]
lsp-cli = ["dep:tower-lsp", "dep:tokio"]

[build-dependencies]
napi-build.workspace = true
